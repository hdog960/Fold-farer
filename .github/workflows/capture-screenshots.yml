name: Capture actual FoldFarer gameplay screenshots
on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
  workflow_dispatch:
concurrency:
  group: foldfarer-screenshots-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless game screenshot browser
        run: |
          npm install --no-save playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium
      - name: Render actual game states
        run: |
          python3 -m http.server 8000 >/tmp/foldfarer-http.log 2>&1 &
          sleep 2
          node tools/generate-icons.mjs
          node tools/capture-screenshots.mjs
      - name: Publish screenshots for creator review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never publish stale captures over newer development commits.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Skipping stale capture: source branch advanced during rendering."
            exit 0
          fi
          git add screenshots/*.png apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture actual First Fold in-engine screenshots [skip ci]"
            if ! git push; then
              echo "Source branch advanced while publishing; a newer run will capture it."
            fi
          fi
